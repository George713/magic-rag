[project]
name = "magic-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlite-vec==0.1.6", "httpx>=0.27,<1"]

[project.optional-dependencies]
models = ["sentence-transformers>=5.1,<6"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/magic_rag"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
